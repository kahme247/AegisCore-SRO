name: aegiscore

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: aegiscore-db:8.4.10
    restart: always
    container_name: aegiscore-db
    networks:
      - aegiscore
    ports:
      - "127.0.0.1:3306:3306"
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: sro
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to the sro database password}"
    volumes:
      # Use a stable Compose volume rather than the image's anonymous
      # /var/lib/mysql volume, which is detached whenever the container is
      # recreated and makes a normal clean restart appear to lose all data.
      - mysql-data:/var/lib/mysql
      # The official MySQL entrypoint restores this dump only when mysql-data
      # is empty. Existing volumes are never overwritten on container restart.
      - "${DB_BACKUP_FILE:?Set DB_BACKUP_FILE to the SQL backup used for fresh database initialization}:/docker-entrypoint-initdb.d/10-aegiscore-backup.sql:ro"
    # A TCP query against both schemas waits for the image's initialization
    # scripts, not merely for mysqld to have opened its port.
    healthcheck:
      test:
        ["CMD-SHELL", 'mysql --protocol=TCP --connect-timeout=2 -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" -e "USE SRO_ACCOUNT; USE SRO_SHARD;"']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # These one-shot jobs are deliberately profile-gated. They must be invoked
  # by an operator in a maintenance window; live servers do not depend on
  # their completion during normal startup.
  migrate-account:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    image: aegiscore-migrations:local
    restart: "no"
    networks:
      - aegiscore
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ACCOUNT_HOST: db
      DB_ACCOUNT_DATABASE: SRO_ACCOUNT
      DB_ACCOUNT_PW: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to the sro database password}"
    command: ["--target=account"]

  migrate-shard:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    image: aegiscore-migrations:local
    restart: "no"
    networks:
      - aegiscore
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SHARD_HOST: db
      DB_SHARD_DATABASE: SRO_SHARD
      DB_SHARD_PW: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to the sro database password}"
    command: ["--target=shard"]

  agent-server:
    build:
      context: .
      dockerfile: agent-server/Dockerfile
    image: aegiscore-agent-server:local
    restart: always
    container_name: aegiscore-agent-server
    networks:
      - aegiscore
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${AGENT_PUBLIC_PORT:-15882}:15882"
    # This is reachable only by services on the aegiscore network; do not publish
    # the Gateway-to-Agent ticket installation port to the host.
    expose:
      - "15883"
      - "15884"
    deploy:
      resources:
        limits:
          # Data.pk2 world loading settles above 5 GiB before any players join.
          memory: 8G
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_ACCOUNT_HOST: db
      DB_ACCOUNT_PW: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to the sro database password}"
      DB_SHARD_HOST: db
      DB_SHARD_PW: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to the sro database password}"
      AGENT_HOST: agent-server
      AGENT_DATA_PATH: ${AGENT_DATA_PATH:-/etc/aegiscore/Data/Data.pk2}
      AGENT_PRELINKED_NAVDATA_FILE: ${AGENT_PRELINKED_NAVDATA_FILE:-/etc/aegiscore/Data/prelinked_navdata.gob}
      AGENT_POSITION_CHECKPOINT_SECONDS: ${AGENT_POSITION_CHECKPOINT_SECONDS:-30}
      AGENT_TIMED_BUFF_DURATION: ${AGENT_TIMED_BUFF_DURATION:-0}
      AGENT_GIANT_MONSTER_SPAWN_RATIO: ${AGENT_GIANT_MONSTER_SPAWN_RATIO:-1000}
      AGENT_TRADE_SAFETY_OPTION: ${AGENT_TRADE_SAFETY_OPTION:-0}
      AGENT_TRADE_SAFETY_NUM: ${AGENT_TRADE_SAFETY_NUM:-8}
      AGENT_FEATURE_WINTER_EVENT_2009_ENABLED: ${AGENT_FEATURE_WINTER_EVENT_2009_ENABLED:-0}
      AGENT_FEATURE_OPEN_MARKET_ENABLED: ${AGENT_FEATURE_OPEN_MARKET_ENABLED:-1}
      BATTLE_ARENA_TICKET_DROP_RATE: ${BATTLE_ARENA_TICKET_DROP_RATE:-0}
      AGENT_DIAGNOSTICS_ENABLED: ${AGENT_DIAGNOSTICS_ENABLED:-0}
      AGENT_DIAGNOSTICS_PORT: ${AGENT_DIAGNOSTICS_PORT:-6060}
      SRO_SESSION_TRACE: ${SRO_SESSION_TRACE:-1}
      SRO_COMBAT_TRACE: ${SRO_COMBAT_TRACE:-0}
      SRO_SESSION_TRACE_DIR: /var/log/aegis/session-traces
      SRO_SESSION_TRACE_CAPACITY: ${SRO_SESSION_TRACE_CAPACITY:-256}
      SRO_SESSION_TRACE_PREFIX_BYTES: ${SRO_SESSION_TRACE_PREFIX_BYTES:-0}
      # Modes: 0/off, players/characters, mobs, or all/everything/1.
      # Prefer players for client-crash diagnostics; all can emit substantial
      # output in a populated world.
      SRO_MOVEMENT_TRACE: ${SRO_MOVEMENT_TRACE:-off}
      MOB_AI_TRACE: ${MOB_AI_TRACE:-0}
      AGENT_ADMISSION_HOST: "0.0.0.0"
      AGENT_ADMISSION_PORT: "15883"
      AGENT_ADMISSION_TLS_CERT_FILE: /run/secrets/aegiscore/agent-cert.pem
      AGENT_ADMISSION_TLS_KEY_FILE: /run/secrets/aegiscore/agent-key.pem
      AGENT_ADMISSION_TLS_CLIENT_CA_FILE: /run/secrets/aegiscore/gateway-ca.pem
      AGENT_MANAGEMENT_ENABLED: "${AGENT_MANAGEMENT_ENABLED:-0}"
      AGENT_MANAGEMENT_HOST: "0.0.0.0"
      AGENT_MANAGEMENT_PORT: "15884"
      AGENT_MANAGEMENT_TLS_CERT_FILE: /run/secrets/aegiscore-management/agent-management-cert.pem
      AGENT_MANAGEMENT_TLS_KEY_FILE: /run/secrets/aegiscore-management/agent-management-key.pem
      AGENT_MANAGEMENT_TLS_CLIENT_CA_FILE: /run/secrets/aegiscore-management/smc-ca.pem
    volumes:
    - ./Data:/etc/aegiscore/Data:ro
    - ./.local/session-traces/agent:/var/log/aegis/session-traces
    - "${SRO_AGENT_TLS_DIR:?Set SRO_AGENT_TLS_DIR to the Agent certificate directory}:/run/secrets/aegiscore:ro"
    - "${SRO_AGENT_MANAGEMENT_TLS_DIR:-./.local/smc-agent-tls}:/run/secrets/aegiscore-management:ro"

  gateway-server:
    build:
      context: .
      dockerfile: gateway-server/Dockerfile
    image: aegiscore-gateway-server:local
    restart: always
    container_name: aegiscore-gateway-server
    depends_on:
      db:
        condition: service_healthy
      agent-server:
        condition: service_started
    ports:
      - "15779:15779"
    networks:
      - aegiscore
    environment:
      DB_ACCOUNT_HOST: db
      DB_ACCOUNT_PW: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to the sro database password}"
      DB_SHARD_HOST: db
      DB_SHARD_PW: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to the sro database password}"
      AGENT_HOST: agent-server
      SRO_SESSION_TRACE: ${GATEWAY_SESSION_TRACE:-0}
      SRO_SESSION_TRACE_DIR: /var/log/aegis/session-traces
      SRO_SESSION_TRACE_CAPACITY: ${SRO_SESSION_TRACE_CAPACITY:-256}
      SRO_SESSION_TRACE_PREFIX_BYTES: ${SRO_SESSION_TRACE_PREFIX_BYTES:-0}
      # Gateway will not invent stock-client identifiers or advertise a
      # loopback/private Agent endpoint in production. Supply the values from
      # an approved capture and the externally reachable Agent address.
      AGENT_PUBLIC_IP: "${AGENT_PUBLIC_IP:?Set AGENT_PUBLIC_IP to the externally reachable Agent IPv4 address}"
      AGENT_PORT: "${AGENT_PUBLIC_PORT:-15882}"
      GATEWAY_HOST: gateway-server
      GATEWAY_ENVIRONMENT: "${GATEWAY_ENVIRONMENT:-production}"
      GATEWAY_PROTOCOL_PROFILES: "${GATEWAY_PROTOCOL_PROFILES:-}"
      GATEWAY_PROTOCOL_PROFILE: "${GATEWAY_PROTOCOL_PROFILE:-vsro188}"
      GATEWAY_PROTOCOL_CONTENT_ID: "${GATEWAY_PROTOCOL_CONTENT_ID:?Set GATEWAY_PROTOCOL_CONTENT_ID from an approved client capture}"
      GATEWAY_PROTOCOL_MODULE_NAME: "${GATEWAY_PROTOCOL_MODULE_NAME:?Set GATEWAY_PROTOCOL_MODULE_NAME from an approved client capture}"
      GATEWAY_PROTOCOL_VERSION: "${GATEWAY_PROTOCOL_VERSION:?Set GATEWAY_PROTOCOL_VERSION from an approved client capture}"
      GATEWAY_PATCH_CHANNEL: "${GATEWAY_PATCH_CHANNEL:-published}"
      GATEWAY_FARM_NAME: "${GATEWAY_FARM_NAME:-AegisCore}"
      AGENT_ADMISSION_PORT: "15883"
      AGENT_ADMISSION_TIMEOUT_SECONDS: ${AGENT_ADMISSION_TIMEOUT_SECONDS:-5}
      AGENT_ADMISSION_TLS_CA_FILE: /run/secrets/aegiscore/agent-ca.pem
      AGENT_ADMISSION_TLS_SERVER_NAME: "${AGENT_ADMISSION_TLS_SERVER_NAME:?Set AGENT_ADMISSION_TLS_SERVER_NAME to the Agent certificate DNS SAN}"
      GATEWAY_ADMISSION_TLS_CERT_FILE: /run/secrets/aegiscore/gateway-cert.pem
      GATEWAY_ADMISSION_TLS_KEY_FILE: /run/secrets/aegiscore/gateway-key.pem
    volumes:
    - "${SRO_GATEWAY_TLS_DIR:?Set SRO_GATEWAY_TLS_DIR to the Gateway certificate directory}:/run/secrets/aegiscore:ro"
    - ./.local/session-traces/gateway:/var/log/aegis/session-traces

  # Dedicated browser-facing management control plane. It is opt-in until an
  # operator credential is configured and binds to host loopback by default.
  # Browsers talk only to this service; Gateway and Agent control APIs remain
  # private service-to-service boundaries.
  smc-server:
    profiles: ["smc"]
    build:
      context: .
      dockerfile: smc-server/Dockerfile
    image: aegiscore-smc-server:local
    restart: unless-stopped
    container_name: aegiscore-smc-server
    networks:
      - aegiscore
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SMC_PUBLIC_PORT:-15900}:15900"
    environment:
      DB_ACCOUNT_HOST: db
      DB_ACCOUNT_PW: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to the sro database password}"
      DB_SHARD_HOST: db
      DB_SHARD_PW: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to the sro database password}"
      SMC_HOST: "0.0.0.0"
      SMC_PORT: "15900"
      SMC_ADMIN_USERNAME: "${SMC_ADMIN_USERNAME:-admin}"
      SMC_ADMIN_PASSWORD: "${SMC_ADMIN_PASSWORD:-}"
      SMC_ADMIN_PASSWORD_HASH: "${SMC_ADMIN_PASSWORD_HASH:-}"
      SMC_ALLOW_WEAK_PASSWORD: "${SMC_ALLOW_WEAK_PASSWORD:-0}"
      SMC_SESSION_TTL: "${SMC_SESSION_TTL:-8h}"
      SMC_COOKIE_SECURE: "${SMC_COOKIE_SECURE:-0}"
      SMC_AUDIT_PATH: "/var/lib/aegiscore-smc/audit.jsonl"
      SMC_MEDIA_EXPORT_ROOT: "/exports"
      SMC_MEDIA_EXPORT_DISPLAY_ROOT: "${SRO_MEDIA_EXPORT_DIR:-${PWD}/.local/media-exports}"
      SMC_MEDIA_EXPORT_BINARY: "./sro-data"
      SMC_GATEWAY_ADDRESS: "gateway-server:15779"
      SMC_AGENT_ADDRESS: "agent-server:15882"
      SMC_AGENT_MANAGEMENT_ENABLED: "${SMC_AGENT_MANAGEMENT_ENABLED:-0}"
      SMC_AGENT_MANAGEMENT_ENDPOINT: "https://agent-server:15884"
      SMC_AGENT_MANAGEMENT_TLS_CERT_FILE: "/run/secrets/aegiscore-smc/smc-cert.pem"
      SMC_AGENT_MANAGEMENT_TLS_KEY_FILE: "/run/secrets/aegiscore-smc/smc-key.pem"
      SMC_AGENT_MANAGEMENT_TLS_CA_FILE: "/run/secrets/aegiscore-smc/agent-management-ca.pem"
      SMC_AGENT_MANAGEMENT_TLS_SERVER_NAME: "${AGENT_MANAGEMENT_TLS_SERVER_NAME:-}"
    volumes:
      - smc-data:/var/lib/aegiscore-smc
      - "${SRO_SMC_TLS_DIR:-./.local/smc-tls}:/run/secrets/aegiscore-smc:ro"
      - "${SRO_MEDIA_EXPORT_DIR:-./.local/media-exports}:/exports"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:15900/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Opt-in until Gateway catalog negotiation is connected. Keeping this behind
  # a profile means a missing operator-built patch catalog cannot break the
  # existing Gateway/Agent runtime.
  download-server:
    profiles: ["patching"]
    build:
      context: .
      dockerfile: download-server/Dockerfile
    image: aegiscore-download-server:local
    restart: always
    container_name: aegiscore-download-server
    networks:
      - aegiscore
    ports:
      - "${DOWNLOAD_PUBLIC_PORT:-15880}:15880"
    environment:
      DOWNLOAD_HOST: "0.0.0.0"
      DOWNLOAD_PORT: "15880"
      DOWNLOAD_MODULE_ID: "${DOWNLOAD_MODULE_ID:-DownloadServer}"
      DOWNLOAD_MANIFEST_PATH: "/etc/aegiscore/patches/manifest.json"
      DOWNLOAD_STORAGE_ROOT: "/etc/aegiscore/patches/files"
      DOWNLOAD_CHUNK_SIZE: "${DOWNLOAD_CHUNK_SIZE:-16384}"
      DOWNLOAD_SESSION_IDLE_SECONDS: "${DOWNLOAD_SESSION_IDLE_SECONDS:-1800}"
      DOWNLOAD_MAX_TRANSFERS: "${DOWNLOAD_MAX_TRANSFERS:-32}"
      DOWNLOAD_MAX_TRANSFERS_PER_IP: "${DOWNLOAD_MAX_TRANSFERS_PER_IP:-4}"
      DOWNLOAD_HEALTH_HOST: "0.0.0.0"
      DOWNLOAD_HEALTH_PORT: "15881"
      SRO_SESSION_TRACE: "${DOWNLOAD_SESSION_TRACE:-0}"
      SRO_SESSION_TRACE_DIR: /var/log/aegis/session-traces
      SRO_SESSION_TRACE_CAPACITY: ${SRO_SESSION_TRACE_CAPACITY:-256}
      SRO_SESSION_TRACE_PREFIX_BYTES: ${SRO_SESSION_TRACE_PREFIX_BYTES:-0}
    volumes:
      - "${SRO_PATCH_DIR:-./Patch}:/etc/aegiscore/patches:ro"
      - ./.local/session-traces/download:/var/log/aegis/session-traces
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:15881/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  patch-admin:
    profiles: ["patch-admin"]
    build:
      context: .
      dockerfile: cmd/patch-admin/Dockerfile
    image: aegiscore-patch-admin:local
    networks:
      - aegiscore
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ACCOUNT_HOST: db
      DB_ACCOUNT_DATABASE: SRO_ACCOUNT
      DB_ACCOUNT_PW: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to the sro database password}"
    volumes:
      - "${SRO_PATCH_DIR:-./Patch}:/etc/aegiscore/Patch"
      - "${SRO_PATCH_SOURCE_DIR:-./PatchSource}:/source:ro"
      - "${SRO_PATCH_SPEC_FILE:-./cmd/patch-admin/example-188-to-189.json}:/etc/aegiscore/spec.json:ro"
    working_dir: /etc/aegiscore

networks:
  aegiscore:

volumes:
  mysql-data:
    # Keep the 8.0 volume untouched as the pre-cutover rollback point.
    name: ${MYSQL_DATA_VOLUME:-aegiscore-mysql-data-84}
  smc-data:
    name: ${SMC_DATA_VOLUME:-aegiscore-smc-data}
